server:
  port: 9083

spring:
  datasource:
    url: jdbc:mysql://${HORARIOS_DB_HOST}:${HORARIOS_DB_PORT}/${HORARIOS_DB_NAME}?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
    username: ${HORARIOS_DB_USERNAME}
    password: ${HORARIOS_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

eureka:
  client:
    service-url:
      defaultZone: http://registry-server:7081/eureka

