spring:
  cloud:
    gateway:
      routes:
        - id: catalogo-route
          uri: lb://catalogo
          predicates:
            - Path=/api/v1/categorias/**
        - id: catalogo-instancia
          uri: lb://catalogo
          predicates:
            - Path=/api/v1/catalogo/instancia

        # PRODUCTO
        - id: producto-route
          uri: lb://producto
          predicates:
            - Path=/api/v1/productos/**
        - id: producto-instancia
          uri: lb://producto
          predicates:
            - Path=/api/v1/producto/instancia

        # AUTH
        - id: auth-route
          uri: lb://auth
          predicates:
            - Path=/api/v1/usuarios/**
        - id: auth-instancia
          uri: lb://auth
          predicates:
            - Path=/api/v1/auth/instancia

        # CANCHAS
        - id: canchas-route
          uri: lb://canchas
          predicates:
            - Path=/api/v1/canchas/**
        - id: canchas-instancia
          uri: lb://canchas
          predicates:
            - Path=/api/v1/canchas/instancia

        # HORARIOS
        - id: horarios-route
          uri: lb://horarios
          predicates:
            - Path=/api/v1/horarios/**
        - id: horarios-instancia
          uri: lb://horarios
          predicates:
            - Path=/api/v1/horario/instancia

        # RESERVAS
        - id: reservas-route
          uri: lb://reservas
          predicates:
            - Path=/api/v1/reservas/**
        - id: reservas-instancia
          uri: lb://reservas
          predicates:
            - Path=/api/v1/reserva/instancia

eureka:
  client:
    service-url:
      defaultZone: http://registry-server:7081/eureka

management:
  endpoints:
    web:
      exposure:
        include: "*"