server:
  port: 9082

spring:
  datasource:
    url: jdbc:mysql://${CANCHAS_DB_HOST}:${CANCHAS_DB_PORT}/${CANCHAS_DB_NAME}?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
    username: ${CANCHAS_DB_USERNAME}
    password: ${CANCHAS_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

eureka:
  client:
    service-url:
      defaultZone: http://registry-server:7081/eureka

